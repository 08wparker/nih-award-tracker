name: Refresh NIH award data

on:
  schedule:
    # 11:00 UTC daily (~07:00 US Eastern). GitHub may delay cron under load; the
    # refresh window overlaps the previous run by a week, so a late or skipped run
    # costs nothing.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Force a full refetch instead of the incremental delta"
        type: boolean
        default: false

# Only one refresh at a time: two concurrent runs would race on the data commit.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide refresh mode
        id: mode
        run: |
          # Full reconciliation on Sundays catches records RePORTER revised or
          # withdrew without touching date_added, which the delta query cannot see.
          if [ "${{ inputs.reconcile }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "flag=--reconcile" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new awards
        run: python scripts/refresh.py ${{ steps.mode.outputs.flag }}

      - name: Rebuild dashboard data
        run: python scripts/build_dashboard.py

      - name: Run tests
        run: |
          python tests/test_fiscal.py
          python tests/test_parity.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --staged --quiet; then
            echo "no new awards today"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
